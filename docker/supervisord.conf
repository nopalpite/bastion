[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:bastion-app]
command=python /app/app.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=websockify --token-plugin=websockify.token_plugins.TokenFile --token-source=/app/vnc_tokens.conf 6080
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
