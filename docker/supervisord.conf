[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:bastion-app]
command=python /app/app.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=websockify --token-plugin=websockify.token_plugins.TokenFile --token-source=/app/vnc_tokens.conf 6080
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc-tls-bridge]
; Pont VeNCrypt/TLS pour les serveurs VNC chiffrés (voir vnc_tls_bridge.py
; et la section VNC du README) - websockify se connecte à ses ports
; locaux plutôt que directement aux machines cibles pour celles
; configurées avec vnc_tls: true.
command=python /app/vnc_tls_bridge.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
