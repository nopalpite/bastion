[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; Sans ces deux sections, "supervisorctl" (utile pour diagnostiquer,
; ex: `docker exec bastion supervisorctl status`) échoue avec
; "unix:///var/run/supervisor.sock no such file" - le socket de contrôle
; n'est simplement jamais créé sans elles.
[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:bastion-app]
command=python /app/app.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
; Passe par start_websockify.py plutôt qu'un appel direct: ajoute
; --cert/--key/--ssl-only si le TLS est activé (voir tls.py) - supervisord
; ne peut pas conditionner ses arguments sur une variable d'environnement.
command=python /app/start_websockify.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc-tls-bridge]
; Pont VNC générique façon vncviewer (voir vnc_tls_bridge.py et la
; section VNC du README) - websockify se connecte à ses ports locaux
; plutôt que directement aux machines cibles pour toute machine ayant un
; port VNC configuré ; le pont sonde chaque serveur et s'adapte (relais
; transparent, ou négociation VeNCrypt/TLS complète si nécessaire).
; -u (non bufferisé): sans ça, print() est bufferisé par bloc dès que la
; sortie standard n'est pas un vrai terminal (le cas ici, sous
; supervisord) — les logs de ce script, peu nombreux, peuvent rester
; coincés dans le tampon et ne jamais atteindre `docker logs` (y compris
; en cas d'erreur au démarrage, silencieusement invisible).
command=python -u /app/vnc_tls_bridge.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
