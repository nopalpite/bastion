<!-- Popup d'actions sur une machine (SSH / VNC / Reboot / Shutdown),
     partagé entre le dashboard et la page plan. Voir static/js/actions.js -->
<div id="action-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-title" id="modal-machine-name">Machine</div>
    <div class="modal-actions">
      <a class="btn" id="modal-ssh" href="#">Terminal SSH</a>
      <a class="btn" id="modal-vnc" href="#">VNC</a>
      <button class="btn danger" id="modal-reboot">Redémarrer</button>
      <button class="btn danger" id="modal-shutdown">Éteindre</button>
    </div>
    <div id="modal-creds-form" style="display:none;">
      <div class="field">
        <label>Utilisateur</label>
        <input type="text" id="modal-username">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="modal-password">
      </div>
      <button class="btn primary" id="modal-confirm-action">Confirmer</button>
    </div>
    <div id="modal-message" class="modal-message"></div>
    <button class="btn" id="modal-close">Fermer</button>
  </div>
</div>
