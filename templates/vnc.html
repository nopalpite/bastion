{% extends "base.html" %}
{% block title %}VNC — {{ machine.name }}{% endblock %}

{% block body %}
<div class="session-header">
  <span>VNC · <span class="machine-name">{{ machine.name }}</span> ({{ machine.host }})</span>
  <a class="btn" href="{{ url_for('dashboard') }}">Retour</a>
</div>

<div id="vnc-connect-form" class="connect-form" style="display:none;">
  <div class="field" id="vnc-username-field">
    <label for="vnc-username">Utilisateur (si demandé)</label>
    <input type="text" id="vnc-username" value="{{ vnc_username }}">
  </div>
  <div class="field">
    <label for="vnc-password">Mot de passe VNC</label>
    <input type="password" id="vnc-password" value="{{ vnc_password }}">
  </div>
  <button class="btn primary" id="vnc-connect-btn">Se connecter</button>
  <div id="vnc-connect-error" class="error-msg"></div>
</div>

<div id="vnc-screen" style="display:none;"></div>

<!--
  noVNC n'est pas distribué via pip: récupérez-le et placez son dossier
  "core" dans static/novnc/ (voir README.md). Le script ci-dessous suppose
  cette arborescence: static/novnc/rfb.js exporte RFB en module ES.
-->
<script type="module">
  import RFB from "{{ url_for('static', filename='novnc/core/rfb.js') }}";

  // On utilise l'hôte que le navigateur a réellement utilisé pour
  // accéder à la page (window.location), pas une valeur fixée côté
  // serveur: "127.0.0.1" y désignerait la machine du client, pas le
  // serveur, dès qu'on accède au bastion depuis une IP/nom de domaine.
  //
  // Le protocole suit celui de la page (wss:// si la page est en https://,
  // sinon le navigateur bloque la connexion en contenu mixte).
  const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  const websockifyPath = {{ (websockify_path or "") | tojson }};

  let url;
  if (websockifyPath) {
    // Derrière un reverse proxy (TLS): on passe par un chemin sur le
    // même host:port que la page, que le reverse proxy fait suivre vers
    // websockify — pas besoin d'exposer son port brut séparément.
    url = `${wsProtocol}//${window.location.host}${websockifyPath}?token={{ machine.id }}`;
  } else {
    // Mode direct (par défaut, pratique en LAN/dev): connexion directe
    // sur le port de websockify.
    url = `${wsProtocol}//${window.location.hostname}:{{ websockify_port }}/?token={{ machine.id }}`;
  }

  const screenEl = document.getElementById("vnc-screen");
  const formEl = document.getElementById("vnc-connect-form");
  const errorEl = document.getElementById("vnc-connect-error");

  // Si des identifiants VNC sont mémorisés pour cette machine, on les
  // fournit dès la construction: RFB.js ne demandera rien d'interactif
  // s'ils suffisent. Sinon (ou s'ils sont refusés), le formulaire
  // ci-dessus prend le relais via "credentialsrequired"/"securityfailure".
  const storedVncUsername = {{ vnc_username | tojson }};
  const storedVncPassword = {{ vnc_password | tojson }};
  const initialCredentials = {};
  if (storedVncUsername) initialCredentials.username = storedVncUsername;
  if (storedVncPassword) initialCredentials.password = storedVncPassword;

  const rfb = new RFB(screenEl, url, { credentials: initialCredentials });

  // Sans ça, un écran distant plus grand que la fenêtre du navigateur ne
  // serait que partiellement visible (comportement par défaut de noVNC),
  // sans aucun moyen de se déplacer pour voir le reste : ça adapte
  // l'affichage à la taille dispo plutôt que de l'afficher à taille
  // réelle avec débordement. #vnc-screen a une hauteur bornée en CSS
  // (voir style.css) — nécessaire pour que noVNC sache dans quel espace
  // rentrer l'image, sinon ce réglage n'aurait aucun effet.
  rfb.scaleViewport = true;

  rfb.addEventListener("credentialsrequired", (e) => {
    const needsUsername = (e.detail.types || []).includes("username");
    document.getElementById("vnc-username-field").style.display = needsUsername ? "block" : "none";
    screenEl.style.display = "none";
    formEl.style.display = "block";
    errorEl.textContent = "";
  });

  rfb.addEventListener("securityfailure", (e) => {
    errorEl.textContent = "Authentification refusée" + (e.detail && e.detail.reason ? ` : ${e.detail.reason}` : " (mot de passe incorrect ?).");
    screenEl.style.display = "none";
    formEl.style.display = "block";
  });

  rfb.addEventListener("connect", () => {
    formEl.style.display = "none";
    screenEl.style.display = "block";
  });

  rfb.addEventListener("disconnect", (e) => {
    formEl.style.display = "none";
    const clean = e.detail && e.detail.clean;
    screenEl.style.display = "block";
    screenEl.innerHTML = clean
      ? '<p style="color:#7c8896;padding:20px;font-family:monospace;">Session VNC fermée.</p>'
      : '<p style="color:#e5484d;padding:20px;font-family:monospace;">Connexion VNC interrompue de façon inattendue (serveur injoignable, mot de passe incorrect, ou session close côté serveur).</p>';
  });

  document.getElementById("vnc-connect-btn").addEventListener("click", () => {
    const username = document.getElementById("vnc-username").value;
    const password = document.getElementById("vnc-password").value;
    rfb.sendCredentials({ username, password });
  });
</script>
{% endblock %}
