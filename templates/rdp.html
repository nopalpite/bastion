{% extends "base.html" %}
{% block title %}RDP — {{ machine.name }}{% endblock %}

{% block body %}
<div class="session-header">
  <span>RDP · <span class="machine-name">{{ machine.name }}</span> ({{ machine.host }})</span>
  <a class="btn" href="{{ url_for('dashboard') }}">Retour</a>
</div>

<div id="rdp-status" class="error-msg"></div>
<div id="rdp-screen"></div>

<!--
  guacamole-common-js (lib JS officielle du projet Apache Guacamole) est
  chargée depuis jsdelivr en tant que module ES — pas de build local requis,
  contrairement à noVNC (voir vnc.html). Elle ne fait que sérialiser les
  événements souris/clavier et interpréter le flux "protocole Guacamole" en
  provenance de rdp_bridge.py (lui-même relayé depuis guacd, voir son
  docstring) ; le décodage RDP proprement dit reste entièrement dans guacd.
-->
<script type="module">
  import Guacamole from "https://cdn.jsdelivr.net/npm/guacamole-common-js@1.5.0/dist/esm/guacamole-common.min.js";

  // Même raisonnement que vnc.html: on part de l'hôte/protocole réellement
  // utilisés par le navigateur pour accéder à la page, pas d'une valeur
  // fixée côté serveur.
  const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  const rdpWsPath = {{ (rdp_ws_path or "") | tojson }};

  let tunnelUrl;
  if (rdpWsPath) {
    // Derrière un reverse proxy (TLS): un chemin sur le même host:port que
    // la page plutôt que d'exposer un port brut séparé (voir la section
    // "Derrière un reverse proxy (TLS)" du README).
    tunnelUrl = `${wsProtocol}//${window.location.host}${rdpWsPath}`;
  } else {
    tunnelUrl = `${wsProtocol}//${window.location.hostname}:{{ rdp_ws_port }}`;
  }

  const statusEl = document.getElementById("rdp-status");
  const screenEl = document.getElementById("rdp-screen");

  // Traduit un Guacamole.Status.Code en message lisible: Status.message
  // n'est PAS déduit automatiquement du code (vérifié dans le code source
  // de guacamole-common-js — le champ reste vide tant qu'on ne le fournit
  // pas soi-même), la doc du projet le dit d'ailleurs explicitement:
  // "For user feedback, it is better to translate the Guacamole status
  // code into a message." Codes les plus probables ici en premier
  // (échec de connexion au pont/websocket, pas encore guacd/RDP).
  function describeGuacamoleStatus(status) {
    const byCode = {
      [Guacamole.Status.Code.UPSTREAM_NOT_FOUND]:
        "Impossible de joindre le pont RDP (rdp_bridge.py). Vérifiez qu'il tourne, et que le port/chemin WebSocket configuré est bien atteignable depuis votre navigateur (voir la section RDP du README, notamment si le site est servi en HTTPS via un reverse proxy).",
      [Guacamole.Status.Code.UPSTREAM_UNAVAILABLE]:
        "Le pont RDP est joignable mais indisponible (peut-être en cours de redémarrage).",
      [Guacamole.Status.Code.UPSTREAM_ERROR]:
        "guacd a rencontré une erreur en essayant de se connecter à la machine cible.",
      [Guacamole.Status.Code.UPSTREAM_TIMEOUT]:
        "La machine cible ne répond pas (délai dépassé).",
      [Guacamole.Status.Code.SESSION_CONFLICT]:
        "La session a été fermée par une autre connexion concurrente.",
      [Guacamole.Status.Code.SESSION_TIMEOUT]:
        "La session a expiré pour inactivité.",
      [Guacamole.Status.Code.SESSION_CLOSED]:
        "La session a été fermée côté serveur.",
      [Guacamole.Status.Code.CLIENT_UNAUTHORIZED]:
        "Connexion refusée (identifiants RDP manquants ou non mémorisés pour cette machine — voir la section RDP du README).",
      [Guacamole.Status.Code.CLIENT_FORBIDDEN]:
        "Connexion refusée par le serveur.",
    };
    const known = byCode[status.code];
    const detail = status.message ? ` (${status.message})` : "";
    return (known || `Erreur inattendue (code ${status.code})`) + detail;
  }

  client.onstatechange = (state) => {
    if (state === Guacamole.Client.State.CONNECTED) {
      statusEl.textContent = "";
    } else if (state === Guacamole.Client.State.DISCONNECTED) {
      statusEl.textContent = "Session RDP fermée.";
    }
  };

  client.onerror = (status) => {
    statusEl.textContent = `Erreur RDP : ${describeGuacamoleStatus(status)}`;
  };

  // Guacamole.Client NE relaie PAS automatiquement les évènements du
  // tunnel WebSocket sous-jacent vers ses propres onerror/onstatechange
  // (vérifié dans le code source: son constructeur ne branche rien sur
  // tunnel.onerror/onstatechange) — sans ce qui suit, un échec de
  // connexion WebSocket pur et simple (mauvaise adresse, TLS non
  // supporté côté pont, pont arrêté...) ne produit ABSOLUMENT AUCUN
  // retour dans la page, avant même d'atteindre guacd.
  tunnel.onstatechange = (state) => {
    if (state === Guacamole.Tunnel.State.CONNECTING) {
      statusEl.textContent = "Connexion en cours...";
    }
  };
  tunnel.onerror = (status) => {
    statusEl.textContent = `Erreur de connexion : ${describeGuacamoleStatus(status)}`;
  };

  // L'authentification RDP a lieu entièrement côté serveur (rdp_bridge.py
  // fournit les identifiants mémorisés à guacd) — le seul paramètre côté
  // navigateur est le token qui identifie la machine cible (voir
  // _handle_ws dans rdp_bridge.py).
  client.connect("token={{ machine.id }}");

  window.addEventListener("beforeunload", () => client.disconnect());

  const mouse = new Guacamole.Mouse(client.getDisplay().getElement());
  mouse.onEach(["mousedown", "mousemove", "mouseup"], (e) => {
    client.sendMouseState(e.state, true);
  });

  const keyboard = new Guacamole.Keyboard(document);
  keyboard.onkeydown = (keysym) => {
    client.sendKeyEvent(1, keysym);
    return true;
  };
  keyboard.onkeyup = (keysym) => {
    client.sendKeyEvent(0, keysym);
  };
</script>
{% endblock %}
