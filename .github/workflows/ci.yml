name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # doit rester alignée avec python:3.12-slim du Dockerfile
      - run: pip install ruff==0.6.9
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      # eventlet.monkey_patch() (app.py) ne supporte pas toutes les versions
      # de Python ; 3.12 correspond à l'image utilisée par le Dockerfile.
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.7.3
      # Non bloquant pour l'instant: des CVE existent déjà sur les versions
      # actuellement épinglées (voir requirements.txt) et corriger ça est un
      # travail à part (bump de version + tests de non-régression), pas le
      # rôle de ce job. Reste visible dans les logs pour suivi.
      - run: pip-audit -r requirements.txt
        continue-on-error: true
