services:
  guacd:
    # Composant natif du projet Apache Guacamole (embarque FreeRDP) qui
    # sait réellement parler RDP — image officielle, aucune dépendance
    # lourde à compiler dans l'image de bastion. Voir rdp_bridge.py et la
    # section RDP du README pour l'architecture complète (bastion ne parle
    # que le protocole Guacamole, texte, à guacd — pas RDP directement).
    image: guacamole/guacd:1.6.0
    container_name: bastion-guacd
    # network_mode: host, comme bastion ci-dessous: rdp_bridge.py joint
    # guacd sur 127.0.0.1:4822, il faut donc qu'ils partagent le même
    # réseau plutôt que de passer par un nom de service Docker.
    network_mode: host
    restart: unless-stopped

  bastion:
    build: .
    container_name: bastion
    # network_mode: host = pas de NAT, le conteneur voit exactement les
    # mêmes interfaces/routes que le host. Recommandé pour un bastion:
    # évite les surprises de routage vers les réseaux cibles, quelle que
    # soit la topologie (mono ou multi-interfaces/VLAN).
    network_mode: host
    restart: unless-stopped
    depends_on:
      - guacd
    environment:
      - BASTION_SECRET_KEY=change-moi-en-production
      - BASTION_ADMIN_USER=admin
      - BASTION_ADMIN_PASSWORD=change-moi
      - BASTION_VNC_WS_PORT=6080
      # Vide par défaut (connexion VNC directe sur le port ci-dessus).
      # À définir (ex: /vnc-ws/) si vous passez par un reverse proxy TLS
      # qui fait suivre ce chemin vers 127.0.0.1:6080 — voir la section
      # "Derrière un reverse proxy (TLS)" du README.
      - BASTION_VNC_WS_PATH=
      - BASTION_RDP_WS_PORT=6081
      # Même principe que BASTION_VNC_WS_PATH ci-dessus, pour le RDP.
      - BASTION_RDP_WS_PATH=
      # Sans cette clé, la mémorisation des identifiants SSH/VNC/RDP est
      # désactivée. Générer avec:
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - BASTION_CREDENTIALS_KEY=
    volumes:
      # Monter l'inventaire (machines.yaml) en externe pour le modifier sans
      # rebuild. Un DOSSIER, pas le fichier directement: voir BASTION_DATA_DIR
      # dans config.py — évite un piège Docker si ./config n'existe pas
      # encore côté hôte (amorcé automatiquement au 1er démarrage).
      - ./config:/app/config
      # Persister les plans de salle uploadés (sinon perdus au rebuild)
      - ./data/maps:/app/static/uploads/maps
